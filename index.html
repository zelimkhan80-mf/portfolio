<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зелим — металл и дерево</title>
<meta name="description" content="Мебель, сварка и металлоконструкции на заказ. Алматы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--steel:#2b3035;--steel-hi:#4a525a;--oak:#a9773f;--paper:#eceeef;--ink:#1c2024;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,Arial,sans-serif;
--pad:clamp(20px,6vw,64px)}
*{box-sizing:border-box;margin:0}
img{max-width:100%;display:block}
body{font-family:var(--body);font-size:18px;line-height:1.55;background:var(--paper);color:var(--ink)}
:focus-visible{outline:3px solid var(--oak);outline-offset:3px}
header{background:var(--steel);color:#fff;padding:clamp(40px,9vw,96px) var(--pad);border-bottom:8px solid var(--oak)}
h1{font-family:var(--display);font-size:clamp(44px,9vw,96px);line-height:1;font-weight:700;max-width:14ch}
header p{margin-top:20px;max-width:34ch;color:#cfd3d6;font-size:20px}
.btn{display:inline-block;margin-top:28px;padding:14px 28px;background:var(--oak);color:#fff;text-decoration:none;font-family:var(--display);font-size:22px;font-weight:600;border-radius:4px}
.btn:hover{background:#fff;color:var(--steel)}
main{padding:clamp(32px,6vw,64px) var(--pad)}
h2{font-family:var(--display);font-size:clamp(32px,5vw,48px);font-weight:700;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--steel-hi)}
#contact{background:var(--steel);color:#fff;padding:clamp(32px,6vw,64px) var(--pad)}
#contact p{max-width:40ch;color:#cfd3d6}
#contact strong{display:block;margin-top:16px;font-size:26px;color:#fff;font-family:var(--display)}
</style>
</head>
<body>
<header>
<h1>Металл и дерево на заказ</h1>
<p>Мебель, сварка и металлоконструкции. Алматы.</p>
<a class="btn" href="#contact">Связаться</a>
</header>
<main>
<h2>Мои работы</h2>
<div class="grid">
<img src="work-1.jpg" alt="Работа 1" loading="lazy">
<img src="work-2.jpeg" alt="Работа 2" loading="lazy">
<img src="work-3.jpg" alt="Работа 3" loading="lazy">
<img src="work-4.jpg" alt="Работа 4" loading="lazy">
<img src="work-5.jpeg" alt="Работа 5" loading="lazy">
<img src="work-6.jpeg" alt="Работа 6" loading="lazy">
</div>
</main>
<section id="contact">
<h2>Связаться</h2>
<p>Расскажите, что нужно сделать, и я отвечу с примерной стоимостью и сроками.</p>
<strong>Телефон / WhatsApp: +7 000 000 00 00</strong>
</section>
</body>
</html>
